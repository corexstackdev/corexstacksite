services:
  - type: web
    name: corexstacksite
    runtime: static
    repo: https://github.com/corexstackdev/corexstacksite
    branch: main
    autoDeployTrigger: commit
    buildCommand: "true"
    staticPublishPath: .
    headers:
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /sw.js
        name: Cache-Control
        value: no-cache

